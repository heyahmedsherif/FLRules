[project]
name = "flrules-monitor"
version = "0.1.0"
description = "Florida Administrative Register monitor — flags rule changes relevant to Muslim civil rights"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "resend>=2.0",
    "twilio>=9.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "click>=8.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "greenlet>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.34",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
flrules = "flrules.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/flrules"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
