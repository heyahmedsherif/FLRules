name: Scheduled Monitor

on:
  schedule:
    # Run every hour during business hours (Mon-Fri 8am-6pm ET)
    - cron: "0 12-22 * * 1-5"
    # Run twice daily on weekends
    - cron: "0 14,22 * * 0,6"
  workflow_dispatch: # manual trigger

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e .

      # TEMP: DB restore disabled for email test — forces fresh scrape
      # - name: Restore previous database
      #   uses: dawidd6/action-download-artifact@v6
      #   with:
      #     name: flrules-db
      #     path: data/
      #     search_artifacts: true
      #     if_no_artifact_found: warn

      - name: Seed test subscriber
        run: flrules subscribe --email Ahmed.Sherif@hey.com --name "Ahmed Sherif" --categories all

      - name: Run pipeline
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: flrules run --issues 5 --notify

      # Upload DB as artifact for persistence between runs
      - name: Upload database
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flrules-db
          path: |
            data/flrules.db
            data/alerts_log.json
          retention-days: 90
          overwrite: true

      # Deploy static dashboard to GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
