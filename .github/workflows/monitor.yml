name: Scheduled Monitor (manual fallback only)

# Scheduled runs are now handled by the cron service on Railway, which writes
# directly to the persistent /data volume — keeping subscribers and alerts in
# the same DB that the web app uses. This workflow is retained only as a manual
# fallback for emergencies (e.g., Railway outage). Note: this workflow's DB is
# isolated from production, so any subscribers added here will NOT receive alerts.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e .

      # Download previous DB if it exists (for continuity between runs)
      - name: Restore previous database
        uses: dawidd6/action-download-artifact@v6
        with:
          name: flrules-db
          path: data/
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Run pipeline
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: flrules run --issues 5 --notify

      # Upload DB as artifact for persistence between runs
      - name: Upload database
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flrules-db
          path: |
            data/flrules.db
            data/alerts_log.json
          retention-days: 90
          overwrite: true
